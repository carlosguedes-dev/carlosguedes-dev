  <!-- Global Scanline -->
  <rect x="0" y="0" width="100%" height="3" fill="rgba(15,23,42,0.03)" style="pointer-events: none;">
    <animate attributeName="y" values="-10;620" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
